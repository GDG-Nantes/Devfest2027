          <path class="p-zone-bar" d="M 48 207 L 96 229 L 112 381 L 72 385 L 70 362 L 13 303 L 2 269 Z"/>
          <text class="p-zone-titre" x="62" y="296">After</text>
          <text class="p-zone-titre" x="62" y="318">Party</text>
          <text class="p-zone-sous" x="62" y="338">Bar</text>
        </g>
