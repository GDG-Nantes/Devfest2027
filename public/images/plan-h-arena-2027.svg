      <path class="p-zone-salle" d="M 879.3 318.8 L 964.6 269.6 L 1016.2 275.4 L 1032.6 309.8 L 995.7 331.1 L 931.8 368 Z" fill="#c9a96a"/>
      <circle cx="1052" cy="301.6" r="3.5" fill="none" stroke="#c9a96a" stroke-width="1.4"/>
      <path d="M 1056 301.6 H 1100" stroke="#c9a96a" stroke-width="1.4"/>
