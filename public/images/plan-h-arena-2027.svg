          <text class="p-zone-titre" x="297.5" y="319">Sponsors / repas</text>
          <text class="p-zone-sous" x="297.5" y="341">Terrain · N0</text>
        </g>
        <g id="espace-accueil-vestiaire" aria-label="Accueil et vestiaire">
