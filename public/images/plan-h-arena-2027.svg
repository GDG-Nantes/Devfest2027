<svg xmlns="http://www.w3.org/2000/svg" class="plan-sponsors proposition-batiment"
      viewBox="-15 10 1265 650" width="1300" height="668"
      font-family="Roboto, Arial, sans-serif" role="img" aria-labelledby="batiment-titre">
      <title id="batiment-titre">DevFest Nantes 2027 — H Arena — espaces du bâtiment</title>
      <desc>After Party à gauche, sponsors et repas sur le terrain, accueil et vestiaire à droite du terrain, conférences au sud-est. Prestige niveau 3, Geofit niveau 2, Neodif niveau 0. Parvis discret. Salon 500 omis.</desc>
      <style>
        .proposition-batiment .p-compas { fill: none; stroke: #afbecd; stroke-width: .12; }
        .proposition-batiment .p-compas-pointe { fill: #afbecd; }
        .proposition-batiment .p-compas-texte { fill: #afbecd; font-size: .85px; text-anchor: middle; dominant-baseline: central; }

        .proposition-batiment .p-enveloppe { fill: #132639; stroke: #2b4a68; stroke-width: 1.6; stroke-linejoin: round; }
        .proposition-batiment .p-gradins { fill: #1b3045; stroke: #36516a; stroke-width: .8; stroke-linejoin: round; }
        .proposition-batiment .p-rangees { fill: none; stroke: #3b5873; stroke-width: .6; }
        .proposition-batiment .p-zone-salle { fill-opacity: .9; stroke: #0d1b2a; stroke-width: .8; stroke-linejoin: round; }
        .proposition-batiment .p-zone-sponsors { fill: #1a3046; stroke: #a9c6de; stroke-width: 2; }
        .proposition-batiment .p-zone-bar { fill: #382c46; stroke: #d9bbdb; stroke-width: 2; stroke-linejoin: round; }
        .proposition-batiment .p-zone-accueil { fill: #3f2636; stroke: #e999a1; stroke-width: 2; stroke-linejoin: round; }
        .proposition-batiment .p-zone-conferences { fill: #39362a; stroke: #f4d35e; stroke-width: 2; stroke-linejoin: round; }
        .proposition-batiment .p-parvis { fill: none; stroke: #4c6276; stroke-width: 1; stroke-dasharray: 5 4; stroke-linejoin: round; }
        .proposition-batiment .p-titre { fill: #f2f5f8; font-size: 24px; font-weight: 700; }
        .proposition-batiment .p-zone-titre { fill: #f2f5f8; font-size: 18px; font-weight: 700; text-anchor: middle; }
        .proposition-batiment .p-zone-sous { fill: #afbecd; font-size: 13px; text-anchor: middle; }
        .proposition-batiment .p-nom-salle { fill: #f2f5f8; font-size: 24px; font-weight: 700; }
        .proposition-batiment .p-niveau-salle { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .proposition-batiment .p-petit { fill: #afbecd; font-size: 12px; font-weight: 700; }
        .proposition-batiment .p-discret { fill: #6f8498; font-size: 13px; text-anchor: middle; }
        .proposition-batiment .p-liaison { fill: none; stroke: #73869a; stroke-width: 1.2; }
        .proposition-batiment .p-flux { fill: none; stroke: #f4d35e; stroke-width: 2.2; stroke-linejoin: round; }
        .proposition-batiment .p-flux-bar { fill: none; stroke: #d9bbdb; stroke-width: 2.2; stroke-linejoin: round; }

      </style>
      <defs>
        <marker id="batiment-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 1 1 L 9 5 L 1 9 Z" fill="#f4d35e"/>
        </marker>
        <marker id="batiment-fleche-bar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9bbdb"/>
        </marker>
      </defs>
      <rect x="-15" y="10" width="1265" height="650" fill="#0d1b2a"/>
      <text class="p-titre" x="0" y="44">DevFest Nantes 2027 · H Arena</text>
