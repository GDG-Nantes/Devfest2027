      <text class="p-niveau-salle" x="1115" y="325.6" fill="#c9a96a">Niveau 3</text>
    </g>
        </g>
        <g id="reperes-cardinaux" transform="translate(1195 95) scale(11)"
      aria-label="Nord, Est, Sud, Ouest">
      <path class="p-compas" d="M 0 2 V -2 M -2 0 H 2"/>
      <path class="p-compas-pointe" d="M 0 -2.7 L -.45 -1.7 L .45 -1.7 Z M 2.7 0 L 1.7 -.45 L 1.7 .45 Z M 0 2.7 L -.45 1.7 L .45 1.7 Z M -2.7 0 L -1.7 -.45 L -1.7 .45 Z"/>
