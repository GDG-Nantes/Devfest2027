      <text class="p-niveau-salle" x="1115" y="506" fill="#f4d35e">Niveau 0</text>
    </g><g id="salle-geofit" data-niveau="2">
      <path d="M 784.2 395.9 L 811.2 454.1 L 811.2 478.7 L 784.2 420.5 Z M 811.2 454.1 L 911.3 470.5 L 911.3 495.1 L 811.2 478.7 Z M 911.3 470.5 L 1032.6 400 L 1032.6 424.6 L 911.3 495.1 Z" fill="#5f385b" stroke="#c45b97" stroke-width="1.6" stroke-linejoin="round"/>
